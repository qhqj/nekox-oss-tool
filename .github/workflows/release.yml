name: Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Select stable Rust
        run: rustup default stable
      - name: Install dependencies
        run: npm ci
      - name: Check version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($version -ne $tauriVersion) { throw 'Version mismatch' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match application version' }
      - name: Type check
        run: npm run typecheck
      - name: Build Windows installer
        run: npm run build:desktop -- -- --locked
      - name: Prepare assets
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force install | Out-Null
          $packages = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe)
          if ($packages.Count -ne 1) { throw 'Expected one NSIS installer' }
          $name = "Nekox-OSS-Tool-$version-windows-x64-setup.exe"
          Copy-Item -LiteralPath $packages[0].FullName -Destination "install/$name"
          $hash = (Get-FileHash "install/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content install/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: install/*
          if-no-files-found: error
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --verify-tag --title "Nekox OSS Tool $env:GITHUB_REF_NAME" --notes-file .github/RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          gh release upload $env:GITHUB_REF_NAME install/* --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
