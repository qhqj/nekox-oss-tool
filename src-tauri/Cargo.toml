[package]
name = "nekox-oss-tool"
version = "0.2.0"
description = "Nekox OSS Tool"
authors = ["nekox"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nekox_oss_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "desktop_offline"
path = "../tests/desktop/native.rs"
harness = false
required-features = ["desktop-integration"]

[features]
desktop-integration = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
